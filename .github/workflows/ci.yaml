name: CI workflow

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check flake
        run: nix flake check

      - name: Run tests
        run: nix develop --command make check

      - name: Build flake
        run: nix build .# -L

      - name: Check docs
        run: |
          VERSION=$(nix eval --raw .#packages.x86_64-linux.default.version)
          nix develop --command make doc VERSION="$VERSION"
          git diff --exit-code

  release:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check and create release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(nix eval --raw .#packages.x86_64-linux.default.version)
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" --draft --generate-notes --title "$TAG"
          fi
